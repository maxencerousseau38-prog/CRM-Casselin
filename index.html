<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="CRM interne hors ligne pour les commerciaux Casselin en salon professionnel." />
  <title>Casselin CRM — Salons</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Casselin CRM" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo" aria-hidden="true">C</span>
      <div class="app-header__titles">
        <span class="app-header__name">Casselin</span>
        <span class="app-header__sub">CRM Salons</span>
      </div>
    </div>
    <div class="app-header__salon" id="header-salon" title="Salon actif"></div>
  </header>

  <main id="view" class="view" tabindex="-1"><!-- Rendu par app.js --></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tabbar__item" data-route="dashboard" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>Accueil</span>
    </a>
    <a class="tabbar__item" data-route="contacts" href="#/contacts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Contacts</span>
    </a>
    <a class="tabbar__item tabbar__item--fab" data-route="new" href="#/contact/new" aria-label="Nouveau contact">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
    </a>
    <a class="tabbar__item" data-route="salons" href="#/salons">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span>Salons</span>
    </a>
    <a class="tabbar__item" data-route="relances" href="#/relances">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>Relances</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
